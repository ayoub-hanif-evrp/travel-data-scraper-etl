<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas — Global Places Explorer</title>
  <meta name="description" content="Atlas is a premium travel discovery demo powered by structured worldwide place data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#results">Skip to results</a>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Atlas">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
            <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
            <path d="M6 16h20M16 6c-3.5 4-5 7.5-5 10s1.5 6 5 10c3.5-4 5-7.5 5-10s-1.5-6-5-10z" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="16" cy="16" r="2.2" fill="currentColor"/>
          </svg>
        </span>
        <div class="brand-text">
          <strong>Atlas</strong>
          <span>Global Places Explorer</span>
        </div>
      </div>

      <form class="search-form" id="search-form" role="search" autocomplete="off">
        <label class="sr-only" for="search-input">Search places, cities, or countries</label>
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="search" placeholder="Search places, cities, or countries" enterkeyhint="search">
        <kbd class="search-hint" id="search-hint">Ctrl K</kbd>
      </form>

      <div class="top-actions">
        <button type="button" class="btn btn-ghost" id="btn-explore" aria-pressed="true">Explore</button>
        <button type="button" class="btn btn-accent" id="btn-nova-header" aria-controls="nova-panel" aria-expanded="false">
          <span class="nova-dot" aria-hidden="true"></span>
          Nova
        </button>
        <button type="button" class="btn btn-icon mobile-only" id="btn-mobile-nav" aria-label="Toggle list and map">
          <span id="mobile-nav-label">Map</span>
        </button>
      </div>
    </header>

    <div class="workspace" data-mobile-view="list">
      <aside class="panel results-panel" id="results-panel">
        <div class="panel-toolbar">
          <div class="metrics" id="product-metrics" aria-live="polite">
            <span>—</span>
          </div>
          <div class="toolbar-right">
            <label class="sort-label" for="sort-select">Sort</label>
            <select id="sort-select" class="sort-select">
              <option value="name">Name</option>
              <option value="country">Country</option>
              <option value="category">Category</option>
            </select>
          </div>
        </div>

        <div class="filters" id="filters">
          <div class="filter-row">
            <div class="dropdown" data-filter="country">
              <button type="button" class="chip-btn" aria-haspopup="listbox" aria-expanded="false">Country</button>
              <div class="dropdown-menu" role="listbox" hidden></div>
            </div>
            <div class="dropdown" data-filter="destination">
              <button type="button" class="chip-btn" aria-haspopup="listbox" aria-expanded="false">City</button>
              <div class="dropdown-menu" role="listbox" hidden></div>
            </div>
            <div class="dropdown" data-filter="category">
              <button type="button" class="chip-btn" aria-haspopup="listbox" aria-expanded="false">Category</button>
              <div class="dropdown-menu" role="listbox" hidden></div>
            </div>
            <button type="button" class="chip-toggle" id="toggle-website" aria-pressed="false">Has website</button>
            <button type="button" class="chip-toggle" id="toggle-coords" aria-pressed="false">On map</button>
            <button type="button" class="chip-clear" id="clear-filters" hidden>Clear all</button>
          </div>
          <div class="active-chips" id="active-chips" hidden></div>
        </div>

        <p class="result-count" id="result-count">Loading places…</p>

        <div class="cards" id="cards" tabindex="-1">
          <div class="state-card" id="loading-state">
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-line"></div>
          </div>
        </div>
      </aside>

      <section class="map-panel" id="map-panel" aria-label="Interactive map">
        <div id="map" role="application" aria-label="World map of places"></div>
        <div class="map-overlay" id="map-status" hidden></div>
        <article class="details-sheet" id="details-sheet" hidden>
          <div class="details-head">
            <div>
              <p class="details-kicker" id="details-kicker"></p>
              <h2 id="details-title"></h2>
            </div>
            <button type="button" class="btn btn-icon" id="details-close" aria-label="Close details">×</button>
          </div>
          <div class="details-body" id="details-body"></div>
          <div class="details-actions" id="details-actions"></div>
        </article>
      </section>
    </div>
  </div>

  <button type="button" class="nova-launcher" id="nova-launcher" aria-controls="nova-panel" aria-expanded="false" aria-label="Open Nova assistant">
    <span class="nova-mascot" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="44" height="44">
        <ellipse class="nova-shadow" cx="32" cy="56" rx="14" ry="3" fill="rgba(17,24,39,0.12)"/>
        <rect class="nova-body" x="16" y="18" width="32" height="28" rx="12" fill="#0F766E"/>
        <rect x="20" y="24" width="24" height="14" rx="7" fill="#ECFDF5"/>
        <circle class="nova-eye" cx="27" cy="31" r="2.4" fill="#111827"/>
        <circle class="nova-eye" cx="37" cy="31" r="2.4" fill="#111827"/>
        <path d="M28 38c2 1.4 6 1.4 8 0" stroke="#99F6E4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <line class="nova-antenna" x1="32" y1="18" x2="32" y2="10" stroke="#0F766E" stroke-width="2"/>
        <circle class="nova-antenna-tip" cx="32" cy="8" r="3" fill="#F59E0B"/>
      </svg>
    </span>
  </button>

  <aside class="nova-panel" id="nova-panel" hidden aria-label="Nova travel assistant">
    <header class="nova-header">
      <div class="nova-header-text">
        <strong>Nova</strong>
        <span>Travel assistant</span>
      </div>
      <div class="nova-header-actions">
        <span class="nova-status" id="nova-status">Checking…</span>
        <button type="button" class="btn btn-ghost btn-sm" id="nova-clear">Clear</button>
        <button type="button" class="btn btn-icon" id="nova-close" aria-label="Close Nova">×</button>
      </div>
    </header>
    <div class="nova-messages" id="nova-messages" role="log" aria-live="polite"></div>
    <div class="nova-suggestions" id="nova-suggestions"></div>
    <form class="nova-compose" id="nova-form">
      <label class="sr-only" for="nova-input">Message Nova</label>
      <textarea id="nova-input" rows="1" placeholder="Ask about places in this dataset…" maxlength="1400"></textarea>
      <button type="submit" class="btn btn-accent" id="nova-send">Send</button>
    </form>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
