[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-data-scraper-etl"
version = "1.0.0"
description = "Reusable Python travel-data scraper and ETL with a map-based Atlas explorer demo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ayoub-hanif-evrp" }]
dependencies = [
    "scrapy>=2.11",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "itemadapter>=0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["travel_scraper*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live network tests (not run by default in CI)",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["travel_scraper", "server", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM117"]
